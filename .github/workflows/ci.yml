name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Qualité (types + lint + tests + build)
    runs-on: ubuntu-latest
    env:
      # Secrets requis par lib/config.ts (fail-closed seulement en production).
      # En CI (NODE_ENV=test) les valeurs de dev sont tolérées, mais on les
      # injecte explicitement pour couvrir aussi les scénarios réels.
      AUTH_SECRET: ci-test-secret-0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts,.tsx --max-warnings=0

      - name: Tests (Jest)
        run: npx jest --ci --coverage

      - name: Build de production (next build)
        run: npm run build

      - name: Standards de contenu — vue complète (BLOQUANT, toutes tranches T0-T5)
        run: npm run content:validate:full
        # Bloquant : toutes les tranches (T0-T5) sont livrées et validées
        # (REMEDIATION_TRACKER.md). Toute régression de contenu bloque le merge.
