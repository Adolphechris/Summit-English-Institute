name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Qualité (types + lint + tests + build)
    runs-on: ubuntu-latest
    env:
      # Secrets requis par lib/config.ts (fail-closed seulement en production).
      # En CI (NODE_ENV=test) les valeurs de dev sont tolérées, mais on les
      # injecte explicitement pour couvrir aussi les scénarios réels.
      AUTH_SECRET: ci-test-secret-0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint . --ext .ts,.tsx --max-warnings=0

      - name: Tests (Jest)
        run: npx jest --ci --coverage

      - name: Build de production (next build)
        run: npm run build

      - name: Standards de contenu — tranches livrées (T1 = niveaux 1-2) BLOQUANT
        run: npm run content:validate:t1
        # Bloquant : le scope couvre exactement les tranches remédiées et poussées.
        # Évolution : T2 → --scope=1-5, T3 → --scope=1-8 (REMEDIATION_TRACKER.md).

      - name: Standards de contenu — vue complète (observation, non bloquant)
        run: npm run content:validate:full
        # Non bloquant tant que T2-T5 n'ont pas rattrapé la baseline (43 leçons
        # insuffisantes, 209 doublons questions — REMEDIATION_PLAN.md §4).
        continue-on-error: true
